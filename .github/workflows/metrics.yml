name: Metrics

# Measures the production site and publishes the README badges to the `metrics` branch.
on:
  # Vercel reports each deployment through the GitHub Deployments API.
  deployment_status:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_URL: https://evgenii-rubin.vercel.app
  LIGHTHOUSE_VERSION: 13.5.0
  RUNS_PER_PAGE: 3

jobs:
  production:
    # Preview deployments are behind Vercel Authentication, so only production is measured.
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    # Queue instead of cancelling, so every measurement finishes and the newest one publishes last.
    concurrency:
      group: metrics
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Run Lighthouse on every page in the sitemap
        run: |
          curl --fail --silent --show-error "$SITE_URL/sitemap.xml" \
            | grep -o '<loc>[^<]*</loc>' | sed -e 's|<loc>||' -e 's|</loc>||' > pages.txt
          mapfile -t pages < pages.txt
          test "${#pages[@]}" -gt 0
          mkdir lighthouse
          for index in "${!pages[@]}"; do
            for run in $(seq "$RUNS_PER_PAGE"); do
              npx --yes "lighthouse@$LIGHTHOUSE_VERSION" "${pages[$index]}" \
                --only-categories=performance,accessibility,best-practices,seo \
                --chrome-flags="--headless=new --no-sandbox" \
                --output=json --output=html \
                --output-path="lighthouse/$(printf '%02d' "$index")-run$run" \
                --quiet
            done
          done

      - name: Scan headers with MDN HTTP Observatory
        run: |
          curl --fail --silent --show-error --request POST \
            "https://observatory-api.mdn.mozilla.net/api/v2/scan?host=${SITE_URL#https://}" \
            --output observatory.json

      - name: Summarize
        run: node scripts/collect-metrics.mjs lighthouse observatory.json "$RUNNER_TEMP/metrics" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: lighthouse/*.html
          retention-days: 14

      # Every run replaces the branch with a single commit, so it never grows.
      # vercel.json keeps Vercel from deploying the branch.
      - name: Publish to the metrics branch
        if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/metrics"
          echo '{ "git": { "deploymentEnabled": false } }' > vercel.json
          git init --quiet --initial-branch=metrics
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --quiet --message "metrics: $SITE_URL at ${GITHUB_SHA::7}"
          git push --force --quiet "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" metrics
